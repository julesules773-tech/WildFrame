<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WildFrame — Admin Dashboard</title>
  <link rel="stylesheet" href="/style.css?v=20260816c" />
  <link rel="stylesheet" href="/admin.css?v=20260816c" />
</head>

<body>

  <!-- ======== Login Overlay ======== -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-icon">🛡️</div>
      <h1 class="login-title">Admin Access</h1>
      <p class="login-desc">Enter the admin password to moderate incoming reports.</p>
      <div class="login-field">
        <input type="password" id="admin-password" placeholder="Admin password" autocomplete="off" />
        <button id="admin-login-btn">Unlock</button>
      </div>
      <p id="login-error" class="login-error hidden">Incorrect password</p>
      <a href="/map" class="login-back">← Back to map</a>
    </div>
  </div>

  <!-- ======== Dashboard ======== -->
  <div id="admin-dashboard" class="hidden">

    <!-- Header -->
    <header id="admin-header">
      <div class="admin-brand">
        <span class="admin-brand-icon">🛡️</span>
        <span class="admin-brand-text">WildFrame Admin</span>
      </div>
      <div class="admin-header-center">
        <span id="pending-count" class="pending-count">0 pending</span>
      </div>
      <div class="admin-header-actions">
        <button id="admin-accept-all-btn" class="admin-accept-all-btn hidden" title="Accept all pending reports">
          <span>✅</span> Accept All
        </button>
        <button id="admin-refresh-btn" class="admin-action-btn" title="Refresh reports">
          <span class="refresh-icon">⟳</span>
        </button>
        <a href="/map" class="admin-action-btn" title="Back to map">
          <span class="back-icon">🗺️</span>
        </a>
        <button id="admin-logout-btn" class="admin-action-btn logout-btn" title="Lock dashboard">
          <span class="lock-icon">🔒</span>
        </button>
      </div>
    </header>

    <!-- Reports Grid -->
    <div id="reports-container">
      <div class="empty-state" id="empty-state">
        <span class="empty-icon">✅</span>
        <h2>All clear!</h2>
        <p>No pending reports to moderate.</p>
      </div>
    </div>

    <!-- Live fires: active Bayesian grids with fuel-moisture context -->
    <section id="fires-section" class="fires-section hidden">
      <div class="fires-header">
        <button id="fires-toggle" class="collapse-toggle" title="Collapse / expand live fires" aria-expanded="true">
          <span class="chevron">▾</span>
        </button>
        <span class="fires-title">🔥 Live fires</span>
        <span id="fires-count" class="fires-count"></span>
        <span class="fires-hint"
          title="EFFIS FFMC/DMC/ISI feed the spread model daily (Europe + Middle East + North Africa); 0 = outside coverage or not fetched yet.">
          FFMC / DMC / ISI from EFFIS
        </span>
      </div>
      <div id="fires-list" class="fires-list"></div>
    </section>

    <!-- Recently auto-approved strip (human backstop for auto-approvals) -->
    <div id="auto-approved-section" class="auto-approved-section hidden">
      <div class="auto-approved-header">
        <button id="auto-approved-toggle" class="collapse-toggle" title="Collapse / expand recently auto-approved"
          aria-expanded="true">
          <span class="chevron">▾</span>
        </button>
        <span class="auto-approved-title">🤖 Recently auto-approved</span>
        <span id="auto-approved-count" class="auto-approved-count"></span>
      </div>
      <div id="auto-approved-list" class="auto-approved-list"></div>
    </div>

    <!-- User feedback (FAQ page suggestions / bug reports / questions) -->
    <div id="feedback-section" class="feedback-section hidden">
      <div class="feedback-header">
        <button id="feedback-toggle" class="collapse-toggle" title="Collapse / expand user feedback"
          aria-expanded="true">
          <span class="chevron">▾</span>
        </button>
        <span class="feedback-title">💬 User feedback</span>
        <span id="feedback-count" class="feedback-count"></span>
      </div>
      <div id="feedback-list" class="feedback-list"></div>
    </div>

    <!-- Blocked IPs (abuse: repeated non-fire uploads) -->
    <div id="blocked-ips-section" class="blocked-ips-section hidden">
      <div class="blocked-ips-header">
        <button id="blocked-ips-toggle" class="collapse-toggle" title="Collapse / expand blocked IPs"
          aria-expanded="true">
          <span class="chevron">▾</span>
        </button>
        <span class="blocked-ips-title">🚫 Blocked IPs</span>
        <span id="blocked-ips-count" class="blocked-ips-count"></span>
      </div>
      <div id="blocked-ips-list" class="blocked-ips-list"></div>
    </div>

    <!-- Toast container (reuse same style) -->
    <div id="admin-toast-container"></div>
  </div>

  <script src="/admin.js?v=20260816c"></script>
  
</body>

</html>
