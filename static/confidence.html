<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyrae — Fire Simulation Confidence</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0e14; color: #e2e8f0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: rgba(15, 20, 30, 0.9); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .topbar h1 { font-size: 18px; font-weight: 600; }
    .topbar h1 span { color: #f97316; }
    .topbar-right { display: flex; align-items: center; gap: 20px; }
    .topbar-right a { font-size: 13px; color: #94a3b8; text-decoration: none; }
    .topbar-right a:hover { color: #f8fafc; }
    .hero { text-align: center; padding: 48px 24px 32px; }
    .hero h2 { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
    .hero p { font-size: 15px; color: #64748b; max-width: 600px; margin: 0 auto; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; }

    /* Metric cards */
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .metric { background: rgba(30, 35, 50, 0.7); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 24px; text-align: center; }
    .metric .icon { font-size: 28px; margin-bottom: 8px; }
    .metric .value { font-size: 32px; font-weight: 700; color: #f8fafc; }
    .metric .label { font-size: 12px; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
    .metric .sub { font-size: 12px; color: #475569; margin-top: 8px; line-height: 1.4; }
    .metric.green .value { color: #22c55e; }
    .metric.cyan .value { color: #22d3ee; }
    .metric.amber .value { color: #f59e0b; }

    /* Sections */
    .section { margin-bottom: 40px; }
    .section h3 { font-size: 18px; font-weight: 600; color: #cbd5e1; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .card { background: rgba(30, 35, 50, 0.7); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 24px; }

    /* Gauge */
    .gauge-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
    .gauge { flex: 1; min-width: 200px; }
    .gauge-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .gauge-header span:first-child { font-size: 13px; color: #94a3b8; }
    .gauge-header span:last-child { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .gauge-bar { height: 10px; background: rgba(255,255,255,0.06); border-radius: 5px; overflow: hidden; }
    .gauge-fill { height: 100%; border-radius: 5px; transition: width 0.8s ease; }
    .gauge-fill.green { background: linear-gradient(90deg, #22c55e, #16a34a); }
    .gauge-fill.cyan { background: linear-gradient(90deg, #22d3ee, #06b6d4); }
    .gauge-fill.amber { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .gauge-fill.red { background: linear-gradient(90deg, #ef4444, #dc2626); }

    /* Methodology */
    .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .method-card { padding: 20px; background: rgba(15, 20, 30, 0.5); border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); }
    .method-card h4 { font-size: 14px; font-weight: 600; color: #f8fafc; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .method-card p { font-size: 13px; color: #64748b; line-height: 1.5; }
    .method-card .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-top: 8px; }
    .tag-satellite { background: rgba(249,115,22,0.15); color: #f97316; }
    .tag-terrain { background: rgba(34,211,238,0.15); color: #22d3ee; }
    .tag-weather { background: rgba(168,85,247,0.15); color: #a855f7; }
    .tag-ml { background: rgba(34,197,94,0.15); color: #22c55e; }

    /* Case study */
    .case-study { margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; }
    .case-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(15, 20, 30, 0.5); }
    .case-header h4 { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .case-header .case-meta { font-size: 12px; color: #64748b; }
    .case-body { display: grid; grid-template-columns: 1fr 1fr; }
    .case-map { height: 280px; background: #0f1520; }
    .case-details { padding: 16px 20px; }
    .case-details .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .case-details .detail-row:last-child { border-bottom: none; }
    .case-details .detail-label { font-size: 12px; color: #64748b; }
    .case-details .detail-value { font-size: 13px; font-weight: 500; color: #e2e8f0; }
    .detail-value.confirmed { color: #22c55e; }
    .detail-value.pending { color: #f59e0b; }
    .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #64748b; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-predicted { background: #f97316; }
    .dot-confirmed { background: #22c55e; }
    .dot-pending { background: #f59e0b; }
    .dot-rejected { background: #ef4444; }
    .loading { text-align: center; padding: 48px; color: #64748b; }
    @media (max-width: 700px) { .case-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" style="text-decoration:none"><h1>🔥 <span>Pyr</span>ae — Confidence</h1></a>
    <div class="topbar-right">
      <a href="/map">Map</a>
    </div>
  </div>

  <div class="hero">
    <h2>Fire Simulation Confidence Report</h2>
    <p>Transparent metrics showing how our Bayesian fire spread model performs against real-world observations. Updated live from production data.</p>
  </div>

  <div class="container" id="content">
    <div class="loading">Loading metrics…</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (async function () {
      const container = document.getElementById("content");

      try {
        const res = await fetch("/api/analytics/confidence");
        if (!res.ok) throw new Error("Failed to load metrics");
        const data = await res.json();
        const m = data.metrics;
        const a = data.accuracy;

        const bt = data.bt_headline || {};
        const detLabel = a.median_detection_hours != null ? a.median_detection_hours + 'h' : '—';
        const detSrc = a.median_detection_src === 'backtest' ? 'Backtest' : (a.median_detection_src === 'live' ? 'Live' : '');
        const accSrc = a.grid_confirmed_src === 'backtest' ? 'Backtest 2020–2024' : (a.grids_evaluated + ' fires evaluated');
        const recSrc = a.ai_recall_src === 'backtest' ? 'Backtest 2020–2024' : (a.ai_total_scans + ' photos scanned');

        container.innerHTML = `
          <!-- Headline metrics -->
          <div class="metrics-grid">
            <div class="metric green">
              <div class="icon">🎯</div>
              <div class="value">${a.grid_confirmed_pct}%</div>
              <div class="label">Prediction Accuracy</div>
              <div class="sub">${a.grid_confirmed_src === 'backtest' ? 'Weighted avg across ' + (bt.total_fires || 0) + ' backtested fires (' + (bt.total_sample_size || 0) + ' samples)' : accSrc + ' — ' + a.grid_confirmed_pct + '% of predicted fires had confirmed citizen reports nearby'}</div>
            </div>
            <div class="metric cyan">
              <div class="icon">🧠</div>
              <div class="value">${a.ai_recall_pct}%</div>
              <div class="label">FIRMS Satellite Detection</div>
              <div class="sub">${a.ai_recall_src === 'backtest' ? 'FIRMS hotspot detection rate across ' + (bt.total_fires || 0) + ' backtested fires' : recSrc + ' — AI correctly flagged ' + a.ai_recall_pct + '% of confirmed fires'}</div>
            </div>
            <div class="metric amber">
              <div class="icon">⏱️</div>
              <div class="value">${detLabel}</div>
              <div class="label">Median Detection Time</div>
              <div class="sub">${a.median_detection_src === 'live' ? 'Time from model prediction to first citizen confirmation (avg: ' + a.avg_detection_hours + 'h)' : 'Calculated from live citizen reports — more data needed'}</div>
            </div>
            <div class="metric">
              <div class="icon">📊</div>
              <div class="value">${m.active_grids}</div>
              <div class="label">Active Fire Tracks</div>
              <div class="sub">${m.total_grids} total modeled fires, ${m.resolved_grids} resolved</div>
            </div>
          </div>

          <!-- Accuracy gauges -->
          <div class="section">
            <h3>📈 Model Performance</h3>
            <div class="card">
              <p style="font-size:12px;color:#64748b;margin-bottom:16px">
                ${a.grid_confirmed_src === 'backtest' ? '📊 Headline metrics sourced from backtest (2020–2024, ' + (bt.total_fires || 0) + ' fires). Switch to live as more citizen reports arrive.' : '📊 Metrics computed from live production data.'}
              </p>
              <div class="gauge-row">
                <div class="gauge">
                  <div class="gauge-header">
                    <span>Prediction accuracy (fire detection rate)</span>
                    <span>${a.grid_confirmed_pct}%</span>
                  </div>
                  <div class="gauge-bar">
                    <div class="gauge-fill green" style="width: ${a.grid_confirmed_pct}%"></div>
                  </div>
                </div>
                <div class="gauge">
                  <div class="gauge-header">
                    <span>FIRMS satellite detection rate</span>
                    <span>${a.ai_recall_pct}%</span>
                  </div>
                  <div class="gauge-bar">
                    <div class="gauge-fill cyan" style="width: ${a.ai_recall_pct}%"></div>
                  </div>
                </div>
              </div>
              <div class="gauge-row">
                <div class="gauge">
                  <div class="gauge-header">
                    <span>Avg spatial overlap (IoU)</span>
                    <span>${bt.avg_iou_pct || a.grid_coverage_pct || 0}%</span>
                  </div>
                  <div class="gauge-bar">
                    <div class="gauge-fill amber" style="width: ${bt.avg_iou_pct || a.grid_coverage_pct || 0}%"></div>
                  </div>
                </div>
                <div class="gauge">
                  <div class="gauge-header">
                    <span>Report confirmation rate</span>
                    <span>${m.total_reports > 0 ? Math.round(m.confirmed_reports / m.total_reports * 100) : 0}%</span>
                  </div>
                  <div class="gauge-bar">
                    <div class="gauge-fill amber" style="width: ${m.total_reports > 0 ? Math.round(m.confirmed_reports / m.total_reports * 100) : 0}%"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- How it works -->
          <div class="section">
            <h3>🔬 How the Model Works</h3>
            <div class="card">
              <div class="method-grid">
                <div class="method-card">
                  <h4>🛰️ FIRMS Satellite Data</h4>
                  <p>NASA FIRMS provides near-real-time thermal anomaly data from MODIS and VIIRS satellites, detecting fires as small as 0.01 km². Updates every 1-3 hours.</p>
                  <span class="tag tag-satellite">Satellite</span>
                </div>
                <div class="method-card">
                  <h4>🌬️ Wind & Weather</h4>
                  <p>Real-time wind speed and direction from weather APIs. Fire spreads faster with wind — the head rate is scaled by wind factor. The model uses a discrete spread kernel.</p>
                  <span class="tag tag-weather">Weather</span>
                </div>
                <div class="method-card">
                  <h4>⛰️ Terrain (DEM)</h4>
                  <p>Copernicus GLO-30 elevation data provides slope and aspect. Fire spreads faster uphill (+4% per degree) and slower downhill. 30m resolution global coverage.</p>
                  <span class="tag tag-terrain">Terrain</span>
                </div>
                <div class="method-card">
                  <h4>🌲 Vegetation (ESA WorldCover)</h4>
                  <p>ESA WorldCover 10m land classification identifies fuel types. Trees and shrubs burn faster than grass or cropland. Currently active for Europe.</p>
                  <span class="tag tag-satellite">Land Cover</span>
                </div>
                <div class="method-card">
                  <h4>📊 Bayesian Probability Grid</h4>
                  <p>Each fire is modeled as a grid of cells with burn probabilities. The model combines satellite observations, wind, slope, and vegetation into a per-cell spread rate using a Bayesian update framework.</p>
                  <span class="tag tag-ml">Model</span>
                </div>
                <div class="method-card">
                  <h4>📸 Citizen Reports</h4>
                  <p>People on the ground submit photos. AI scans each photo for fire/smoke, then a corroboration system auto-approves reports confirmed by satellite data or other reports.</p>
                  <span class="tag tag-ml">AI</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Case studies -->
          <div class="section">
            <h3>🔥 Case Studies</h3>
            <div id="case-studies">
              ${data.case_studies.length === 0
                ? '<div class="card" style="text-align:center;padding:32px;color:#64748b">No case studies yet — more fire data needed for comparison.</div>'
                : data.case_studies.map((cs, i) => `
                  <div class="case-study">
                    <div class="case-header">
                      <h4>Fire #${cs.grid_id} — ${cs.lat.toFixed(3)}°, ${cs.lon.toFixed(3)}°</h4>
                      <span class="case-meta">${new Date(cs.updated_at).toLocaleDateString()} · Max prob: ${(cs.prob_max * 100).toFixed(1)}%</span>
                    </div>
                    <div class="case-body">
                      <div class="case-map" id="case-map-${i}"></div>
                      <div class="case-details">
                        <div class="detail-row">
                          <span class="detail-label">Model prediction</span>
                          <span class="detail-value">🔥 Fire detected</span>
                        </div>
                        <div class="detail-row">
                          <span class="detail-label">Peak probability</span>
                          <span class="detail-value">${(cs.prob_max * 100).toFixed(1)}%</span>
                        </div>
                        <div class="detail-row">
                          <span class="detail-label">Predicted area</span>
                          <span class="detail-value">${cs.area_km2.toFixed(2)} km²</span>
                        </div>
                        <div class="detail-row">
                          <span class="detail-label">Nearby citizen reports</span>
                          <span class="detail-value">${cs.nearby_reports}</span>
                        </div>
                        <div class="detail-row">
                          <span class="detail-label">Confirmed by citizens</span>
                          <span class="detail-value ${cs.confirmed_reports > 0 ? 'confirmed' : 'pending'}">
                            ${cs.confirmed_reports > 0 ? '✅ ' + cs.confirmed_reports + ' confirmed' : '⏳ Pending'}
                          </span>
                        </div>
                        <div class="detail-row">
                          <span class="detail-label">Verdict</span>
                          <span class="detail-value ${cs.confirmed_reports > 0 ? 'confirmed' : 'pending'}">
                            ${cs.confirmed_reports > 0 ? '✅ Model confirmed by ground truth' : '⏳ Awaiting verification'}
                          </span>
                        </div>
                        <div class="legend">
                          <span class="legend-item"><span class="legend-dot dot-predicted"></span> Model prediction</span>
                          <span class="legend-item"><span class="legend-dot dot-confirmed"></span> Confirmed report</span>
                          <span class="legend-item"><span class="legend-dot dot-pending"></span> Pending report</span>
                        </div>
                      </div>
                    </div>
                  </div>
                `).join("")
              }
            </div>
          </div>

          <!-- Historical Validation (backtest) -->
          ${data.backtest && data.backtest.length > 0 ? `
          <div class="section">
            <h3>🔬 Historical Validation</h3>
            <div class="card">
              <p style="font-size:13px;color:#94a3b8;margin-bottom:16px">Backtest results: model predictions compared against real fire perimeters from CAL FIRE.</p>
              ${data.backtest.map(bt => `
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;padding:16px;background:rgba(15,20,30,0.5);border-radius:8px">
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Region</div>
                    <div style="font-size:14px;font-weight:600;color:#f8fafc">${bt.state} ${bt.year}</div>
                  </div>
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Total Fires</div>
                    <div style="font-size:14px;font-weight:600;color:#f8fafc">${bt.total_fires}</div>
                  </div>
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Detection Rate</div>
                    <div style="font-size:14px;font-weight:600;color:#22c55e">${bt.detection_rate_pct}%</div>
                  </div>
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Avg IoU</div>
                    <div style="font-size:14px;font-weight:600;color:#22d3ee">${bt.avg_iou_pct}%</div>
                  </div>
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Median IoU</div>
                    <div style="font-size:14px;font-weight:600;color:#22d3ee">${bt.median_iou_pct}%</div>
                  </div>
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Area Error</div>
                    <div style="font-size:14px;font-weight:600;color:#f59e0b">${bt.avg_area_error_pct}%</div>
                  </div>
                  <div>
                    <div style="font-size:11px;color:#64748b;text-transform:uppercase">Sample Size</div>
                    <div style="font-size:14px;font-weight:600;color:#f8fafc">${bt.sample_size}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          ` : ''}

          <!-- Limitations -->
          <div class="section">
            <h3>⚠️ Known Limitations</h3>
            <div class="card" style="font-size:13px;color:#94a3b8;line-height:1.7">
              <ul style="padding-left:20px">
                <li><strong>Satellite revisit delay:</strong> FIRMS data arrives 1-3 hours after a fire starts. The model can only track fires once the first satellite observation is received.</li>
                <li><strong>No real-time fuel moisture:</strong> The model uses static vegetation cover (WorldCover 2021). Actual burn conditions depend on recent rainfall, humidity, and seasonal dryness.</li>
                <li><strong>Flat terrain assumption (outside Europe):</strong> DEM terrain data is currently only available for Europe. Fires outside this region spread without slope effects.</li>
                <li><strong>Crowd-dependent validation:</strong> Citizen reports are the primary ground truth. Remote fires with no nearby observers may go unconfirmed.</li>
                <li><strong>Resolution limits:</strong> The model operates at ~1 km grid resolution. Fine-scale fire behavior (spotting, crown fires) is not captured.</li>
              </ul>
            </div>
          </div>
        `;

        // Init case study maps
        data.case_studies.forEach((cs, i) => {
          const mapEl = document.getElementById("case-map-" + i);
          if (!mapEl) return;

          const map = L.map(mapEl, { zoomControl: false, attributionControl: false, dragging: true })
            .setView([cs.lat, cs.lon], 13);

          L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            maxZoom: 19,
          }).addTo(map);

          // Fire origin marker
          L.circleMarker([cs.lat, cs.lon], {
            radius: 12, color: "#f97316", fillColor: "#f97316",
            fillOpacity: 0.3, weight: 2,
          }).addTo(map).bindPopup(`<b>Predicted fire origin</b><br>Grid #${cs.grid_id}<br>Prob: ${(cs.prob_max * 100).toFixed(1)}%`);

          // Report markers
          cs.reports.forEach(r => {
            const color = r.status === "confirmed" ? "#22c55e" : r.status === "pending" ? "#f59e0b" : "#ef4444";
            L.circleMarker([r.lat, r.lon], {
              radius: 6, color: color, fillColor: color, fillOpacity: 0.8, weight: 1,
            }).addTo(map).bindPopup(`<b>${r.status}</b><br>${r.source_type}<br>${r.ai_verdict || "no AI verdict"}`);
          });

          // Fix map rendering
          setTimeout(() => map.invalidateSize(), 100);
        });

      } catch (err) {
        container.innerHTML = `<div class="card" style="text-align:center;padding:48px;color:#ef4444">Error loading metrics: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
