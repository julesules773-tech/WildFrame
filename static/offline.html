<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyrae — Temporarily Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 440px;
      padding: 48px 36px;
      background: rgba(30, 35, 50, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #f8fafc; }
    p { font-size: 15px; line-height: 1.6; color: #94a3b8; margin-bottom: 24px; }
    .retry-btn {
      display: inline-block;
      padding: 10px 28px;
      background: linear-gradient(135deg, #f97316, #dc2626);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,115,22,0.3); }
    .status { font-size: 12px; color: #475569; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔥</div>
    <h1>Pyrae is temporarily offline</h1>
    <p>We're experiencing a brief service interruption. The fire detection system is still monitoring — we'll be back shortly.</p>
    <button class="retry-btn" onclick="location.reload()">Try again</button>
    <div class="status">Auto-retry in <span id="countdown">30</span>s</div>
  </div>
  <script>
    let t = 30;
    const el = document.getElementById('countdown');
    const iv = setInterval(() => {
      el.textContent = --t;
      if (t <= 0) { clearInterval(iv); location.reload(); }
    }, 1000);
  </script>
</body>
</html>
