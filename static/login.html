<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyrae — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      max-width: 400px; width: 100%; padding: 40px 32px;
      background: rgba(30, 35, 50, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo span { font-size: 36px; }
    .logo h1 { font-size: 22px; font-weight: 600; margin-top: 8px; color: #f8fafc; }
    .logo p { font-size: 13px; color: #64748b; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px; font-size: 14px;
      background: rgba(15, 20, 30, 0.8); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #e2e8f0; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #f97316; }
    .btn {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
      background: linear-gradient(135deg, #f97316, #dc2626); color: #fff;
      border: none; border-radius: 50px; cursor: pointer; margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249,115,22,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .error { color: #ef4444; font-size: 13px; margin-top: 8px; text-align: center; display: none; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #475569; }
    .footer a { color: #f97316; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🔥</span>
      <h1>Pyrae</h1>
      <p>Wildfire Detection Platform</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@company.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <div class="error" id="error-msg"></div>
      <button type="submit" class="btn" id="submit-btn">Sign in</button>
    </form>
    <div class="footer">
      <a href="/">← Back to Pyrae</a>
    </div>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const errEl = document.getElementById("error-msg");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      errEl.style.display = "none";

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        // Redirect based on role
        const role = data.user.role;
        if (role === "internal") window.location.href = "/admin";
        else if (role === "government") window.location.href = "/dashboard";
        else window.location.href = "/dashboard";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
